[package]
name = "ankhimate-editor"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ankhimate-core = { version = "0.1.0", path = "../core" }
ankhimate-document = { version = "0.1.0", path = "../document" }
ankhimate-formats = { version = "0.1.0", path = "../formats" }
ankhimate-export = { version = "0.1.0", path = "../export" }
ankhimate-render = { version = "0.1.0", path = "../render" }
ankhimate-plugins = { version = "0.1.0", path = "../plugins" }
rfd = "0.15"
eframe = "0.34.3"
env_logger = "0.11.10"
log = "0.4.32"
wgpu = "29.0.3"
egui_tiles = "0.15.0"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.33.1"
serde_json = "1.0.150"
# Already locked/transitively distributed by formats; fingerprints do not store project data.
sha2 = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
directories = "6.0.0"
spade = "2.15.1"
resvg = { version = "0.48", default-features = false }
ureq = "2.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.47", features = ["rt", "macros", "sync", "time"] }
futures-util = "0.3"
zeroize = "1"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
